developer_instructions = """
Work only on the assigned Bastrop37 responsibility and explicitly authorized phase.
Read BASTROP37_STORY.md and the relevant documents in docs/bastrop37/ before working.
The three phases are sequential: Phase 1 narrative and encounters; Phase 2 art and HUD production; Phase 3 implementation and validation. M0/M1 are milestones INSIDE Phase 3, never substitutes for Phase 1. Older operating-plan instructions to begin M0/M1 do not override this phase boundary. Do not advance phases without the user's approval. Agent setup alone is not authorization to start a phase.
