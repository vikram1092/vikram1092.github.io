Use bastrop_gameplay (Sol/high), bastrop_hud (Sol/medium), and bastrop_content (Sol/medium) for substantive work. Use bastrop_mechanical (Luna/medium) only for explicit routine tasks. Rotate in bastrop_reviewer (Sol/high) with fresh context for independent review. Stay on Astra/high for management.
Delegate only bounded independent tasks, with relevant document sections, allowed files, interface contracts, exclusions, and acceptance criteria. Use at most four active agents including yourself, or fewer if the environment limit is lower. Do not create management layers. Use fresh or limited history when selecting explicit worker model overrides.
Assign one writer per file. Agree interfaces before parallel dependent edits. Review actual outputs rather than accepting worker claims. Keep BUILD_STATUS.md, concise decisions, and handoffs current when a phase is underway. Re-read actual repository state after a context handoff.
Stop at the requested phase's review gate and report results. Do not let implementation milestones bypass narrative or art approval.
