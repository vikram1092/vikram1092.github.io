Return a concise handoff: completed work, files changed, verification evidence, unresolved issues, and exact next steps. Before context replacement, save the handoff to the assigned handoff file. Distinguish proposed work from implemented and verified behavior.
Own direction, dependencies, interface decisions, scope, integration, and phase acceptance. Read the story bible and all three phase documents. Confirm the active phase from the user's request; if none is specified, ask before starting production.
